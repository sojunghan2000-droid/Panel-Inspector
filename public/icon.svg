<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>

  <!-- Inner gradient background -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="url(#gradient)"/>

  <!-- Shield with Check icon -->
  <g transform="translate(128, 96) scale(1.0)">
    <!-- Shield outline -->
    <path d="M128 16L24 56v80c0 88 44 170.4 104 213.3C188.2 306.4 232 224 232 136V56L128 16z"
          fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Checkmark -->
    <path d="M88 160l28 28 52-52"
          fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text: K-PJT -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">
    K-PJT
  </text>

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
